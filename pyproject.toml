[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-redactor"
version = "0.1.0"
description = "Coordinate-aware PDF PII highlighting with Adobe PDF Services integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24",
  "PyYAML>=6.0",
  "python-dotenv>=1.0,<2",
  "google-genai>=1.30,<3",
  "pdfservices-sdk>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pdf-redactor = "pdf_redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
